name: iosApp
options:
  bundleIdPrefix: com.thinkandact
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 必须关：KMP preBuild 脚本要跑 ./gradlew 编/签 shared.framework，
    # 开了脚本沙盒会把 gradle 挡在外面、构建失败。Xcode「推荐设置」会想开它，别理。
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM 留空：在 Xcode 的 Signing & Capabilities 里选你的 Apple ID 即可（免费个人账号真机 7 天）。
    DEVELOPMENT_TEAM: ""
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      # 随手记桌面小组件(WidgetKit 扩展),随主 App 一起打包嵌入。
      - target: InboxWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinkandact.iosApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        # 链接 KMP 静态框架 shared.framework（由下方 preBuild 脚本现编现签）。
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - shared
        # 静态框架带 Kotlin/Native 运行时，需链接这些系统库。
        SWIFT_OBJC_INTEROP_MODE: objcxx
    preBuildScripts:
      - name: "Compile & embed shared.framework (Kotlin/Native)"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  # 随手记桌面小组件:纯 SwiftUI/WidgetKit,不链 KMP 框架(直连 Supabase 公开端点)。
  # 与主 App 通过 App Group 共享登录 token。
  InboxWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: InboxWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinkandact.iosApp.InboxWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: InboxWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: InboxWidget/InboxWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
