<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF5F0; --terra:#B5654A; --clay:#9E5238; --amber:#E29A52;
    --ink:#3B322D; --muted:#A7998F;
    --cn:"Noto Sans SC",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
    --disp:"Bricolage Grotesque",var(--cn);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--cn);color:var(--ink);min-height:100vh;
    background:radial-gradient(130% 90% at 50% -20%,#FFFCF9,#EFE2D6 60%,#E6D5C7);
    display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 16px 50px;-webkit-font-smoothing:antialiased;user-select:none}
  .stage{position:relative;width:330px;height:680px;border-radius:42px;overflow:hidden;background:var(--bg);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 34px 70px -22px rgba(120,72,48,.45),0 10px 26px -12px rgba(120,72,48,.3);
    border:1px solid rgba(181,101,74,.10);display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto;padding:20px 18px 10px}
  .scroll::-webkit-scrollbar{display:none}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .back{font-size:19px;color:var(--ink);opacity:.7}
  .title{font-family:var(--disp);font-weight:700;font-size:21px;color:var(--clay)}
  .sub{font-size:12.5px;color:var(--muted);margin:7px 0 18px}

  .row{display:flex;gap:11px;cursor:pointer}
  .tcol{width:44px;flex:none;text-align:right;padding-top:14px}
  .tcol .t{font:500 12px/1 var(--mono);color:var(--muted)}
  .card{flex:1;background:#fff;border:1px solid #F0E5DB;border-radius:14px;padding:12px 14px;margin-bottom:9px;
    box-shadow:0 5px 14px -13px rgba(120,72,48,.4);display:flex;align-items:center;gap:10px}
  .card .nm{flex:1;font-size:14px;color:var(--ink)}
  .star{color:var(--amber);font-size:12px}
  .pill{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px}
  .pill.done{background:#F3E4D8;color:var(--clay)} .pill.skip{background:#EFEAE5;color:var(--muted)}

  /* 已过去 */
  .row.past .card{background:#FAF4EE;border-color:#F2E9E0;box-shadow:none}
  .row.past .nm{color:#A89A8E}

  /* 进行中 */
  .row.now .card{background:linear-gradient(180deg,#FCEFE2,#F8E6D7);border-color:#E6C5AC;box-shadow:0 10px 24px -14px rgba(181,101,74,.5)}
  .row.now .nm{font-weight:600;color:var(--clay)}
  .row.now .col2{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .row.now .tag{font-size:10.5px;font-weight:700;color:#fff;background:var(--terra);padding:3px 9px;border-radius:999px}
  .row.now .left{font:600 11px/1 var(--mono);color:var(--clay)}

  /* now 线 */
  .nowline{display:flex;align-items:center;gap:9px;margin:3px 0 12px;padding-left:44px}
  .nowline .dot{width:8px;height:8px;border-radius:50%;background:var(--terra);flex:none;box-shadow:0 0 0 4px rgba(181,101,74,.16)}
  .nowline .ln{flex:1;height:1.5px;background:linear-gradient(90deg,var(--terra),transparent)}
  .nowline .lb{font:600 11px/1 var(--mono);color:var(--terra)}

  /* 建议项(软) */
  .row.sug .card{background:transparent;border:1px dashed #E0C9B6;box-shadow:none}
  .row.sug .nm{color:#9A8B7E;font-size:13px}
  .row.sug .badge{font-size:10px;color:var(--amber);font-weight:700;border:1px solid #ECCBA6;border-radius:999px;padding:2px 7px}
  .row.sug .add{font-size:12px;font-weight:700;color:var(--terra)}

  .dock{padding:12px 16px 18px;background:linear-gradient(0deg,var(--bg) 72%,rgba(251,245,240,0));border-top:1px solid #F0E5DB}
  .voice{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px;border-radius:18px;background:#fff;border:1px solid #EAD9CB;box-shadow:0 10px 24px -15px rgba(181,101,74,.45);color:var(--clay);font-weight:600;font-size:14.5px}
  .vhint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
</style>

<div class="stage">
  <div class="scroll">
    <div class="top"><span class="back">←</span><span class="title">今天的计划</span></div>
    <div class="sub">随时看、随时改 · 6 件做成 4 件</div>

    <div class="row past"><div class="tcol"><div class="t">08:00</div></div><div class="card"><span class="nm">健身</span><span class="pill done">完成</span></div></div>
    <div class="row past"><div class="tcol"><div class="t">09:00</div></div><div class="card"><span class="nm">写文档 <span class="star">★</span></span><span class="pill done">完成</span></div></div>
    <div class="row past"><div class="tcol"><div class="t">12:00</div></div><div class="card"><span class="nm">午饭</span><span class="pill done">完成</span></div></div>
    <div class="row past"><div class="tcol"><div class="t">14:00</div></div><div class="card"><span class="nm">深度工作 <span class="star">★</span></span><span class="pill done">完成</span></div></div>

    <div class="row now"><div class="tcol"><div class="t">16:00</div></div><div class="card"><span class="nm">回消息</span><div class="col2"><span class="tag">进行中</span><span class="left">还剩约 22 分</span></div></div></div>

    <div class="nowline"><span class="dot"></span><span class="ln"></span><span class="lb">现在 16:08</span></div>

    <div class="row sug"><div class="tcol"></div><div class="card"><span class="badge">建议</span><span class="nm">歇会儿,喝杯水</span><span class="add">+ 加入</span></div></div>
    <div class="row"><div class="tcol"><div class="t">17:30</div></div><div class="card"><span class="nm">对接设计</span></div></div>
    <div class="row"><div class="tcol"><div class="t">18:30</div></div><div class="card"><span class="nm">健身</span></div></div>
    <div class="row"><div class="tcol"><div class="t">20:00</div></div><div class="card"><span class="nm">陪客户吃饭 <span class="star">★</span></span></div></div>
  </div>

  <div class="dock">
    <div class="voice">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5654A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21.5"/></svg>
      按住说一句,改今天
    </div>
    <div class="vhint">点任意一条也能改 · 比如「把回消息往后挪半小时」「加一件晚上写周报」</div>
  </div>
</div>
